# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel 10 Pro XL (mustang), stage 0.
#
# Same rules as device/cheetah/device.conf: data only, no shell expansion.
# Every value comes from an explicit source in NOTES.md; nothing copied from
# Exynos Pixel descriptors without checking laguna (Tensor G5).

# --- Identity ---
CODENAME=mustang
NAME="Pixel 10 Pro XL"
SOC=laguna
COMPATIBLE="google,lga-mustang"
# Storage guard and USB networking only. No radio, charge, or camera services,
# and no boot-success marker before each subsystem has its own runbook.
PACKAGE=omamobile-device-mustang

# --- Kernel and device tree ---
# Tensor G5 (laguna / lga) is non-Exynos and lives under arch/arm64/boot/dts/google/
# in mainline Linux v7.4+ (commits cf3df78629f2, ecf6405fa6c5), not exynos/google/.
DTB=google/lga-mustang.dtb
# Staged (L-44): leave SOC_IDS and SOC_COMPATIBLE unset so bin/omamobile
# initramfs/images/flash/push and tools/install-phone fail closed until:
#   1. arch/arm64/boot/dts/google/lga-mustang.dtb lands in linux-omarchy-mobile;
#   2. SOC_COMPATIBLE / AVB_FOOTERS support merges into bin/omamobile (#27);
#   3. stock DTB header slot and AVB footer parameters are verified on hardware
#      (BRINGUP-M1.md step 1).
# Upstream lga.dtsi /soc_compatible entries (product_id=0x5, B0 major=1, A0 major=0):
# SOC_COMPATIBLE="b0:0x5:1:0:0 a0:0x5:0:0:0"
# Stock ABL aborts if /aliases/ufs0 is missing from the base FDT before upstream
# lga.dtsi defines ufs@3c400000; this overlay adds /ufs-placeholder + alias.
DTB_OVERLAYS="ufs-placeholder"

# --- Bootloader glue ---
DTBO_SOURCE=mustang-m1-overlay.dts
# Retail MP1.0 board ID/rev from upstream lga-mustang.dts (0x70502..0x70505 on
# pre-production units; verify on hardware in BRINGUP-M1.md step 1).
DTBO_BOARD_ID=0x70506
DTBO_BOARD_REV=0x10000
# Do NOT pass Exynos earlycon=exynos4210,0x10A00000: laguna debug UART is
# Synopsys DW APB UART at 0x0db62000 (/chosen/stdout-path = "serial0:115200n8").
# console=tty0 last makes the VT /dev/console while streaming printk to ttyS0 too.
VENDOR_CMDLINE="console=ttyS0,115200n8 console=tty0 earlycon clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x1000
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10
# Chained boot partition footers (confirm rollback index on stock boot_b via
# avbtool info_image in BRINGUP-M1.md step 1 before enabling with #27):
# AVB_FOOTERS="boot:0x4000000 init_boot:0x800000"
# AVB_ROLLBACK_INDEX=...
# AVB_SECURITY_PATCH=2026-10-05

# --- Storage guard ---
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

# --- Initramfs ---
# Shared script. Do NOT set SIMPLEFB_TRIG_CON (laguna uses VeriSilicon vs_drm
# at 0x0ec00000, not Samsung DECON; L-4) and NEVER set BRINGUP_PROBE=1 (its
# Exynos 0x10060000 / 0x1c0b0000 MMIO reads do not exist on laguna).
INITRAMFS_INIT=/initramfs/init
# Native panel resolution (stock boot mode defaults to 1080x2404; splash is not
# in bootargs, and BRINGUP-M1.md step 5 reads the live /chosen framebuffer size).
PANEL_SIZE=1344x2992
